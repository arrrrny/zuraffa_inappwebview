# Federated plugin monorepo created by `zfa package create-plugin` (issue #1604).
name: zuraffa_inappwebview
description: >-
  Zuraffa-native in-app webview for Flutter — clean typed API, headless webview, cookies, sessions.
version: 7.2.0
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0

dependencies:
  # Zuraffa 7.x — the 6.x line is no longer maintained; 7.0.1 is current.
  zuraffa: ^7.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

repository: https://github.com/arrrrny/zuraffa_inappwebview
issue_tracker: https://github.com/arrrrny/zuraffa_inappwebview/issues

topics:
  - inappwebview
  - clean-architecture
  - zuraffa

# Fleet-wide xml policy: pin the override to the latest xml so graphs that
# still transitively pull the abandoned minio (xml 6.x) resolve cleanly.
dependency_overrides:
  xml: 7.1.0
