# Federated plugin monorepo created by `zfa package create-plugin` (issue #1604).
name: zuraffa_inappwebview_ios
description: >-
  Zuraffa-native in-app webview for Flutter — clean typed API, headless webview, cookies, sessions.
version: 7.2.0
homepage: https://zuraffa.com

environment:
  sdk: ^3.11.0

dependencies:
  # Aligned with the app-facing package for the 0.1.0 release — the adapters
  # were left on ^6.3.0, which made the whole family unresolvable.
  # See arrrrny/zuraffa_inappwebview#11.
  zuraffa: ^7.2.0
  zuraffa_inappwebview: ^7.2.0
  zuraffa_inappwebview_platform: ^7.2.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0

dependency_overrides:
  # Local development only — resolve the in-family siblings to this
  # checkout; stripped on publish.
  zuraffa_inappwebview:
    path: ../zuraffa_inappwebview
  zuraffa_inappwebview_platform:
    path: ../zuraffa_inappwebview_platform

  xml: 7.1.0
repository: https://github.com/arrrrny/zuraffa_inappwebview
issue_tracker: https://github.com/arrrrny/zuraffa_inappwebview/issues

topics:
  - inappwebview
  - ios
  - clean-architecture
  - zuraffa
